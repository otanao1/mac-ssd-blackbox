<style>
#se-navigation{--paper:light-dark(#fff,#202124);--ink:light-dark(#242426,#eeeef0);--sub:light-dark(#696970,#b9b9c0);--line:light-dark(#e1e1e6,#46464d);--soft:light-dark(#f3f3f6,#2c2c32);--blue:light-dark(#1769b0,#80bcff);--selected:light-dark(#e6effa,#293d55);--orange:light-dark(#b86b1b,#efad60);color:var(--ink);background:var(--paper);font:14px -apple-system,BlinkMacSystemFont,sans-serif;border:1px solid var(--line);border-radius:10px;padding:18px;max-width:980px;margin:auto}

n .periodtools button,#se-navigation .periodtools select{font-size:12px;padding:4px 6px}#se-navigation .targetrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}#se-navigation .targetrow .path{flex:1;min-width:120px}#se-navigation .observation{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;margin:6px 0}#se-navigation .observation input{flex:1;min-width:100px}#se-navigation .children{padding:4px 12px;background:var(--soft);font-size:12px}#se-navigation .rankbar{height:3px;background:var(--blue);margin-top:5px;opacity:.55}#se-navigation .period{margin:9px 0;font-size:12px;font-variant-numeric:tabular-nums}#se-navigation .chart{height:145px;width:100%;display:block;margin:5px 0}#se-navigation .chart text{fill:var(--sub);font-size:11px}#se-navigation .path{font-size:12px;overflow-wrap:anywhere;margin:8px 0}#se-navigation .crumbs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}#se-navigation .items{margin-top:8px}#se-navigation .item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line)}#se-navigation .item small{display:block;color:var(--sub);font-size:11px;overflow-wrap:anywhere}#se-navigation .item label{display:flex;gap:8px;align-items:center;min-width:0}#se-navigation .item input{accent-color:var(--blue)}#se-navigation .notice{min-height:20px;font-size:12px;color:var(--sub);margin-top:7px}#se-navigation .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}#se-navigation .legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:4px}#se-navigation .caption{margin:4px 0 10px}#se-navigation .notes{margin-top:18px;color:var(--sub);font-size:12px}#se-navigation .notes summary{cursor:pointer}#se-navigation [hidden]{display:none!important}@media(max-width:600px){#se-navigation{padding:12px}.cards{gap:4px}#se-navigation .cards{grid-template-columns:1fr}#se-navigation .card-jump strong{display:inline;float:right;margin:0;font-size:19px}#se-navigation .card-jump .muted{display:block;margin-top:6px}#se-navigation .controls{align-items:flex-start}#se-navigation .controls>div{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){#se-navigation{scroll-behavior:auto}}
</style>
<header id="sen-top" class="title row between"><h2>Dashboard</h2><span class="muted">操作モック · 合成データ · 暫定案</span></header>
<div class="row between caption"><span class="muted">内蔵SSD</span><span class="muted">最新観測 10/27 12:00</span></div>
<div class="cards">
<button class="card-jump" data-jump="sen-l1"><span>現在のSSD空き容量</span><strong>128.40 GiB</strong><span class="muted">SSD空き容量へ ↓</span></button>
<button class="card-jump" data-jump="sen-l2"><span>24時間前からの容量増加</span><strong>+4.20 GiB</strong><span class="muted">フォルダ使用量（全体）へ ↓</span></button>
<button class="card-jump" data-jump="sen-l3"><span>1時間前との容量増加</span><strong>+0.85 GiB</strong><span class="muted">フォルダ使用量（特定アプリ）へ ↓</span></button>
</div>
<section id="sen-l1" aria-labelledby="sen-l1-title"><div class="row between"><h3 id="sen-l1-title">SSD空き容量 <span class="muted">1分間隔</span></h3><button class="link" data-jump="sen-top">Dashboardへ ↑</button></div><div class="row controls"><div class="segment"><button data-l1="free" aria-pressed="true">SSD空き容量</button><button data-l1="change" aria-pressed="false">空き容量の増減</button></div><span class="muted">24時間固定 · 1分間隔</span></div><div class="period">10/26 12:00 – 10/27 12:00</div><svg class="chart" id="sen-l1-chart" role="img" aria-label="SSD空き容量の操作確認用グラフ"></svg><div id="sen-l1-caption" class="muted"></div></section>
<div id="sen-layers"></div>
<details class="notes"><summary>確認後に決めること</summary><p>セクションの縦の長さ／L3のSingle・3日、L2のMulti・7日という初期値／期間を変えた際の右端固定／カードからの移動時に選択状態を維持するか。</p></details><div class="notes">操作・値は合成例です。Multiの行明細・子検索／ページ送り・SSD増減棒・比較判定の詳細は省略表示。#22・#26の既存仕様は維持し、このモックを変更仕様とはしません。</div>
<script>
(()=>{
const root=document.getElementById('se-navigation'),q=s=>root.querySelector(s),qa=s=>root.querySelectorAll(s);
const colors=['var(--orange)','var(--blue)','light-dark(#8654b8,#c49ae7)','light-dark(#2b8056,#85cba5)','light-dark(#b5487b,#e89bbc)'];
const tree={cache:{name:'アプリキャッシュ',path:'/Sample/Library/Caches',size:18.4,kids:['browser','editor','other']},browser:{name:'Browser',path:'/Sample/Library/Caches/Browser',size:7.2,kids:['media','web']},media:{name:'Media',path:'/Sample/Library/Caches/Browser/Media',size:4.1,kids:[]},web:{name:'Web',path:'/Sample/Library/Caches/Browser/Web',size:3.1,kids:[]},editor:{name:'Editor',path:'/Sample/Library/Caches/Editor',size:5.6,kids:['build']},build:{name:'Build',path:'/Sample/Library/Caches/Editor/Build',size:5.6,kids:[]},other:{name:'その他キャッシュ',path:'/Sample/Library/Caches/Other',size:5.6,kids:[]},dev:{name:'開発データ',path:'/Sample/Developer',size:42.3,kids:['derived','archives']},derived:{name:'DerivedData',path:'/Sample/Developer/DerivedData',size:26.5,kids:[]},archives:{name:'Archives',path:'/Sample/Developer/Archives',size:15.8,kids:[]},temp:{name:'一時領域',path:'/Sample/tmp',size:3.2,kids:[]},apps:{name:'アプリケーション',path:'/Applications',size:55.4,kids:['tool']},tool:{name:'SampleTool',path:'/Applications/SampleTool',size:2.8,kids:[]},lib:{name:'ライブラリ',path:'/Library',size:34.2,kids:[]},users:{name:'ユーザーデータ',path:'/Sample/Users',size:96.1,kids:['home']},home:{name:'ホーム',path:'/Sample/Users/demo',size:96.1,kids:['docs']},docs:{name:'Documents',path:'/Sample/Users/demo/Documents',size:22.4,kids:[]}};
const config={L3:{title:'フォルダ使用量（特定アプリ）',roots:['cache','dev','temp','apps','lib','users'],periods:[1,3,7,30],cadence:'毎時'},L2:{title:'フォルダ使用量（全体）',roots:['apps','lib','users','dev','cache','temp'],periods:[7,30,90],cadence:'日次'}};
const fresh=()=>({L3:{mode:'Single',days:3,offset:0,trail:['cache'],selected:['cache','dev','temp'],message:'',tick:24,expanded:null},L2:{mode:'Multi',days:7,offset:0,trail:['apps'],selected:['apps','lib','users'],message:'',tick:24,expanded:null},l1:'free'});
let state=fresh();const saved=window.openai?.widgetState?.modelContent;if(saved?.version===1)restore(saved);
function restore(s){for(const l of ['L3','L2']){const v=s[l];if(!v)continue;state[l].tick=Number.isInteger(v.tick)?Math.max(0,Math.min(24,v.tick)):24;state[l].mode=['Single','Multi'].includes(v.mode)?v.mode:state[l].mode;state[l].days=config[l].periods.includes(v.days)?v.days:state[l].days;state[l].offset=Number.isInteger(v.offset)&&v.offset<=0?v.offset:0;if(Array.isArray(v.trail)&&config[l].roots.includes(v.trail[0])&&v.trail.every((id,i)=>tree[id]&&(!i||tree[v.trail[i-1]].kids.includes(id))))state[l].trail=v.trail;if(Array.isArray(v.selected))state[l].selected=[...new Set(v.selected.filter(id=>config[l].roots.includes(id)))].slice(0,5);}state.l1=s.l1==='change'?'change':'free';}
function save(){window.openai?.setWidgetState?.({modelContent:{version:1,...state},privateContent:null}).catch(()=>{});}
const stamp=t=>{const d=new Date(t);return `${d.getUTCMonth()+1}/${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2,'0')}:00`;};
const now=Date.UTC(2026,9,27,12),day=86400000;
function range(l){const s=state[l],end=now+s.offset*day;return `${stamp(end-s.days*day)} – ${stamp(end)}`;}
function shell(l){return `<section id="sen-${l.toLowerCase()}" data-layer="${l}" aria-label="${config[l].title}"><div class="row between"><div class="row"><h3>${config[l].title}</h3><span class="muted" data-slot="cadence"></span></div><button class="link" data-jump="sen-top">Dashboardへ ↑</button></div><div class="segment" aria-label="${l}の分析モード"><button data-action="mode" data-value="Single">Single</button><button data-action="mode" data-value="Multi">Multi</button></div><div class="periodbar"><div class="period" data-slot="range"></div><div class="periodtools"><select data-action="period" aria-label="${l}の表示期間">${config[l].periods.map(d=>`<option value="${d}">${d===1?'24時間':d+'日間'}</option>`).join('')}</select><button data-action="prev" aria-label="前の期間">← 前</button><button data-action="next" aria-label="次の期間">次 →</button><button data-action="latest">最新へ</button></div></div><div data-slot="single"><div class="targetrow"><label>監視対象 <select data-action="target" aria-label="${l}の監視対象">${config[l].roots.map(id=>`<option value="${id}">${tree[id].name}</option>`).join('')}</select></label><span class="path muted" data-slot="path"></span></div><div class="row"><button data-action="parent">↑ 親へ</button><nav class="crumbs" data-slot="crumbs" aria-label="${l}のディレクトリ階層"></nav></div></div><div class="row between caption"><strong data-slot="chart-title"></strong><span class="muted">GiB</span></div><svg class="chart" data-slot="chart" role="img" aria-label="${l}の操作確認用グラフ"></svg><div class="legend" data-slot="legend"></div><label class="observation">選択日時 <strong data-slot="observed"></strong><input type="range" min="0" max="24" step="1" data-action="time" aria-label="${l}の観測日時"></label><div class="row between" style="margin-top:12px"><strong data-slot="list-title"></strong><span class="muted" data-slot="count"></span></div><div class="items" data-slot="items"></div><div class="notice" data-slot="notice" aria-live="polite"></div></section>`;}
q('#sen-layers').innerHTML=shell('L3')+shell('L2');
function chart(svg,seed,count,bars=false,layer=null){const w=Math.max(250,svg.getBoundingClientRect().width),h=145,L=35,R=w-12;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);let html='';for(let i=0;i<3;i++)html+=`<line x1="${L}" x2="${R}" y1="${20+i*44}" y2="${20+i*44}" stroke="var(--line)"/>`;for(let s=0;s<count;s++){const pts=Array.from({length:25},(_,i)=>[L+i*(R-L)/24,65+Math.sin(i*.43+s+seed)*22+Math.cos(i*.7+seed)*9+s*3]);html+=bars?pts.map(([x,y])=>`<rect x="${x}" y="${Math.min(y,65)}" width="${Math.max(2,(R-L)/35)}" height="${Math.max(1,Math.abs(y-65))}" fill="${colors[s]}" opacity=".65"/>`).join(''):`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${colors[s]}" stroke-width="1.8"/>`;}html+=`<text x="${L}" y="138">${stamp((layer?now+state[layer].offset*day-state[layer].days*day:now-day))}</text><text x="${R}" y="138" text-anchor="end">${stamp(layer?now+state[layer].offset*day:now)}</text>`;if(!count)html+=`<text x="${w/2}" y="68" text-anchor="middle">系列を選択してください</text>`;if(layer){const xx=L+state[layer].tick/24*(R-L);html+=`<line x1="${xx}" x2="${xx}" y1="10" y2="115" stroke="var(--sub)" stroke-dasharray="3 4"/>`;svg.onclick=e=>{const rect=svg.getBoundingClientRect();act(layer,'time',Math.round(Math.max(0,Math.min(24,(e.clientX-rect.left-L)/(R-L)*24))));};}svg.innerHTML=html;}
function render(l){const sec=q(`[data-layer="${l}"]`),find=s=>sec.querySelector(s),s=state[l],single=s.mode==='Single',id=s.trail.at(-1),node=tree[id];sec.querySelectorAll('[data-action="mode"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.value===s.mode));find('[data-action="period"]').value=s.days;find('[data-slot="range"]').textContent=range(l);find('[data-action="next"]').disabled=s.offset===0;find('[data-action="latest"]').disabled=s.offset===0;find('[data-slot="cadence"]').textContent=config[l].cadence+'観測';find('[data-slot="single"]').hidden=!single;find('[data-action="target"]').value=s.trail[0];find('[data-action="parent"]').disabled=s.trail.length===1;find('[data-slot="crumbs"]').innerHTML=s.trail.map((id,i)=>`<button class="link" data-action="crumb" data-value="${i}" ${i===s.trail.length-1?'disabled':''}>${tree[id].name}</button>`).join('<span class="muted">/</span>');find('[data-slot="path"]').textContent=node.path;find('[data-slot="chart-title"]').textContent=single?node.name:'容量増減';chart(find('[data-slot="chart"]'),s.offset+s.days+(single?Object.keys(tree).indexOf(id):0),single?1:s.selected.length,false,l);find('[data-slot="legend"]').innerHTML=(single?[id]:s.selected).map((id,i)=>`<span><i style="background:${colors[i]}"></i>${tree[id].name}</span>`).join('');find('[data-slot="list-title"]').textContent=single?`${node.name}のサブフォルダ`:'増減ランキング · 行のチェックで系列選択';find('[data-slot="count"]').textContent=single?`${node.kids.length}件`:`${s.selected.length}/5系列`;find('[data-slot="observed"]').textContent=observed(l);find('[data-action="time"]').value=s.tick;find('[data-slot="items"]').innerHTML=single?node.kids.map(child=>`<div class="item"><div>${tree[child].name}<small>${tree[child].path}</small></div><div class="row"><span>${(tree[child].size+s.offset*.03+s.tick*.015).toFixed(2)} GiB</span><button data-action="child" data-value="${child}">開く →</button></div></div>`).join(''):config[l].roots.map((id,i)=>({id,i,value:delta(i,s.tick)})).sort((a,b)=>(b.value.value??-Infinity)-(a.value.value??-Infinity)).map(({id,i,value})=>`<div class="item"><label><input type="checkbox" data-action="series" data-value="${id}" ${s.selected.includes(id)?'checked':''}><span><span style="color:${s.selected.includes(id)?colors[s.selected.indexOf(id)]:'var(--sub)'}">●</span> ${tree[id].name}<small>${tree[id].path}</small><div class="rankbar" style="width:${Math.abs(value.value||0)*20}px;opacity:${value.type==='参考'?.25:.6}"></div></span></label><div class="row"><span>${value.text}</span><details><summary aria-label="比較の詳細">ⓘ</summary><span class="muted">${value.reason}<br>${observed(l)}</span></details><button data-action="expand" data-value="${id}" ${tree[id].kids.length?'':'disabled'}>${tree[id].kids.length}件 ${s.expanded===id?'▾':'▸'}</button></div></div>${s.expanded===id?`<div class="children">${tree[id].kids.map((child,j)=>`<div class="item"><span>${tree[child].name}</span><span>${delta(i+j,s.tick).text}</span></div>`).join('')}</div>`:''}`).join('');find('[data-slot="notice"]').textContent=s.message||(single&&!node.kids.length?'この階層より下の記録はありません。親へ戻るか、別の対象を選択できます。':single?'子の「開く」で移動。パンくずから上の階層へ戻れます。':'親子の値は重複するため合計しません。初期3系列、最大5系列。');}
function observed(l){const s=state[l];return stamp(now+s.offset*day-s.days*day+s.days*day*s.tick/24);}
function delta(i,t){const type=['通常','参考','比較不可'][(i+Math.floor(t/3))%3],value=type==='比較不可'?null:2.8-i*.69+(t-12)*.07;return {type,value,text:value===null?'—':(type==='参考'?'参考 ':'')+(value>=0?'+':'')+value.toFixed(2)+' GiB',reason:type==='通常'?'正常比較の合成例':type==='参考'?'失敗領域が一致する参考比較の合成例。未取得領域内部の増減は不明。':'比較不可の合成例。欠測や取得範囲の変化を0にしません。'};}
function l1(){qa('[data-l1]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l1===state.l1));chart(q('#sen-l1-chart'),2,1,state.l1==='change');q('#sen-l1-caption').textContent=state.l1==='free'?'SSD空き容量 [GiB] · グラフは操作確認用のダミー':'前回観測からの空き容量増減 [GiB] · プラスは空き容量の増加';}
function act(l,action,value){const s=state[l];s.message='';if(action==='time')s.tick=Math.max(0,Math.min(24,+value));if(action==='expand')s.expanded=s.expanded===value?null:value;if(action==='mode')s.mode=value;if(action==='period')s.days=+value;if(action==='prev')s.offset-=s.days;if(action==='next')s.offset=Math.min(0,s.offset+s.days);if(action==='latest')s.offset=0;if(action==='target')s.trail=[value];if(action==='parent'&&s.trail.length>1)s.trail.pop();if(action==='child'&&tree[s.trail.at(-1)].kids.includes(value))s.trail.push(value);if(action==='crumb')s.trail=s.trail.slice(0,+value+1);if(action==='series'){if(s.selected.includes(value))s.selected=s.selected.filter(id=>id!==value);else if(s.selected.length<5)s.selected.push(value);else s.message='最大5系列です。選択中の系列を解除してから追加してください。';}render(l);save();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.jump){q('#'+b.dataset.jump).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});return;}if(b.dataset.l1){state.l1=b.dataset.l1;l1();save();return;}if(b.dataset.action){const sec=b.closest('[data-layer]');act(sec.dataset.layer,b.dataset.action,b.dataset.value);}});
root.addEventListener('input',e=>{if(e.target.dataset.action==='time'){act(e.target.closest('[data-layer]').dataset.layer,'time',e.target.value);}});
root.addEventListener('change',e=>{if(e.target.dataset.action){const sec=e.target.closest('[data-layer]');act(sec.dataset.layer,e.target.dataset.action,e.target.dataset.value||e.target.value);}});
function all(){l1();render('L3');render('L2');}all();new ResizeObserver(all).observe(root);
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.modelContent;if(s?.version===1){restore(s);all();}});
})();
</script>
</div>
